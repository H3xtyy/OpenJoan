# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the release-flavour archives when a tag v* is pushed and attaches them to a DRAFT GitHub release, which a
# maintainer publishes by hand after the checks of docs/RELEASING.md. No game file is ever in an archive.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # Built in the manylinux_2_28 container (glibc 2.28, GCC 14): the archive and the AppImage start on any x86-64
    # distribution from 2018 on, systemd or not (tools/build_linux_release.sh).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/src -w /src quay.io/pypa/manylinux_2_28_x86_64 \
            tools/build_linux_release.sh ${{ github.ref_name }} 4
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
      - run: cmake --preset windows-hook-x64-release
      - run: cmake --build --preset windows-hook-x64-release -j4
      - run: python tools/package_release.py build/windows-hook-x64-release ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  draft:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --draft --title "OpenJoan ${{ github.ref_name }}" --generate-notes
