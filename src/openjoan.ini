; OpenJoan settings - copy next to the executable (openjoan.exe / openjoan, in the game folder). joan_re.ini, the
; name before the Phase 1 rename, is still read when openjoan.ini does not exist (openjoan.log says so).
; This is the file of the debug build (presets linux-x64, windows-hook-x64, vs2026-hook-x64), which reads every setting
; below; the release (player) build (linux-x64-release, vs2026-hook-x64-release) reads only the settings of
; openjoan_release.ini (build_flavor.hpp).
; This file works as it is: every reimplemented function is on by default, and the defaults below are those of a
; normal game run, the same as the release build's (OpenGL renderer, our own graphics card answers, every [Fixes] correction on). A setting left out of the
; file takes the value shown here. Keys of retired modes that older inis may still hold are ignored and named in
; openjoan.log.

[Loader]
; openjoan.exe runs the game without joan.exe: its code is our C++ - every original code address the game still uses
; (calls, vtables, callbacks) is a slot of a table that leads to its C++ replacement (openjoan_loader.log: "code slots",
; "seal: 1568 code relocs"); reaching an address without one ends the game with "original code needed: ..." in
; openjoan.log. Its data is one object of openjoan.exe ("joan_image", .rdata / .data / .bss / .idata), moved away from
; joan.exe's fixed address 0x009cf000 and relocated at startup (openjoan_loader.log: "data image", "data relocations").
; Every registered replacement is installed unless [Hooks] Disable switches it off.
; The game's other files (Resource, model, texture, script, sound, movie folders ...) are still needed; joan.exe not.
; Nothing of joan.exe is at a fixed address any more: openjoan.exe runs with ASLR and DEP, its
; address changes from run to run (openjoan_loader.log: "image base"), and nothing is reserved at joan.exe's old range
; 0x00400000..0x00a96000. A fault at one of those old addresses where nothing is mapped - code or data the game still
; tried to reach at its old fixed address - is reported ("stray absolute data access" / "stray code address" in
; openjoan.log) and ends the game with a message box.
;
; PoisonDead=1: the parts of joan.exe's data that are proven unused (exception tables, data of the replaced CRT /
;     D3DX / JPEG libraries ...) are not built into openjoan.exe and stay zero; with 1 they are filled with 0xCD
;     instead, so a game run proves nothing reads them (openjoan_loader.log reports it).
PoisonDead=0

[Hooks]
; 1 = write openjoan.log next to openjoan.exe
Log=1
; Every reimplemented function is installed (openjoan.log: "replace ..." lines). Disable turns some off: comma
; separated function names (e.g. ResourceIdx::get_index) or module names (e.g. ilib/resx.cpp, crt/heap,
; render/nvlink = our vertex shader linker instead of SHADER\nvlinker.dll, debug/menu = the developer menu);
; * = all except debug/menu. Only for tests: since joan.exe's code is gone, a disabled function that the game
; reaches ends it with "original code needed" in openjoan.log (render/nvlink and debug/menu excepted: without them
; the game loads nvlinker.dll / runs without the menu). The module fix/uninit follows [Fixes] UninitReads.
Disable=
; Enable= is no longer needed and can be left out: until stage S7d the replacements still being tested (crt/*,
; d3dx/*, render/*, most game/* and en3d/* modules ...) were installed only when listed here. An old list still
; works: it is checked (names that match nothing are reported in openjoan.log) and otherwise ignored.

[Graphics]
; The game's Direct3D 8 device is our OpenGL 4.6 implementation (if it cannot start, openjoan.log says why). Its
; answers to the game's adapter queries (caps, display modes, format checks) are our own, the system's Direct3D 8 is
; never started: openjoan.log gets a one-time dump of the answers ("d3d8 adapter:" lines) and every distinct query
; the game makes ("d3d8 query:"); the texture loader picks texture sizes / formats from these answers.
; 1 = OpenGL debug context; driver errors and warnings are written to openjoan.log,
;     plus per-frame statistics and pictures of frames 100 and 1000 (openjoan_frame*.bmp)
GLDebug=0
; every N seconds: a line in openjoan.log with the frame rate and where the frame time went (the game's draw
; calls, the buffer swap / frame limiter, the game's own work) and the GL state changes per frame; 0 = off
PerfLog=0
; 1 = models whose vertices / triangles did not change since the last frame are drawn from a copy kept on the
;     graphics card instead of being copied again (much faster with long draw distances); 0 = copied every frame
StreamCache=1
; shadows (only while the game's own shadow option is on):
;   1 = the original stencil shadows (units near the camera; costs a lot of CPU in big battles)
;   0 = no shadows
;   2 = sun shadows from a shadow map: soft edges, cast by everything the camera sees (units, buildings,
;       trees, terrain), little CPU cost. Not part of the original game.
Shadows=1
; Shadows=1: 1 = the original shadows' volumes are made by the graphics card (same shadows, much less CPU in big
;     battles), 0 = made by the CPU every frame as the original
GpuShadowVolumes=1
; Grass: 1 = each grass patch's draws are recorded once and drawn again directly (the same grass, much less CPU),
;     0 = every patch drawn through the whole object path every frame as the original
GrassBatching=1
; GrassMultiDraw=1: consecutive grass draws with the same state go to the GPU as one call (fewer driver calls).
;     0 = one call per grass draw (as before; use if the GPU driver has trouble with it)
GrassMultiDraw=1
; GrassBindless=1: the grass textures are passed per draw (bindless textures), so grass of different textures still
;     goes to the GPU in one call. 0 = textures bound one by one (fewer grass draws per call).
GrassBindless=1
; Shadows=2: how far from the camera shadows reach (world units; Joan is about 79 tall), the shadow map's
; resolution (texels per side: more = sharper, costs GPU memory and time), how dark full shadow is (%),
; and how soft the edges are (texels of the shadow map)
ShadowDistance=4000
ShadowMapSize=4096
ShadowStrength=45
ShadowSoftness=3
; Shadows=2: 1 = trees, bushes and other cut-outs of the transparent pass cast shadows too (replayed from
;     the previous frame), 0 = only the opaque world casts
ShadowFoliage=1
; Shadows=2: objects up to this many world units outside the picture are still drawn so they cast shadows
; into it (a tree just above the top edge); more = shadows of taller objects / a lower sun, more draw calls.
; 0 = only what is on screen casts
ShadowCasterMargin=1500
; water: 1 = modern water (reflections of the scene and sky, refraction of the bed with depth colour,
;     animated waves, sun glint, soft shores), 0 = the original flat water. Not part of the original game.
Water=1
; Water=1: world units of water the light crosses before it is mostly the water's colour (more = clearer),
; wave strength (%), reflection strength (%)
WaterClarity=160
WaterWaves=60
WaterReflection=100
; Water=1: how fast streams and rivers flow, in % of the original game (which flows very fast)
WaterFlow=60
; 1 = trees and other objects between the camera and the player turn see-through (the original game),
; 0 = they stay solid
CameraFade=0
; 1 = lit models (buildings, units, props) are lit per pixel instead of per vertex (smooth on low-poly
;     models), 0 = per vertex as the original. Not part of the original game.
PixelLighting=1
; Shadows=2: how much of the shadows baked into the levels' ground lightmaps (under trees, buildings, walls)
; is kept, in %: 100 = the original lightmaps, 0 = baked shadows removed (the shadow map draws them instead).
; Only small dark areas are lifted; the lightmaps' broad shading (hills, colour) stays.
BakedShadows=25
; 1 = wait for vertical sync, 0 = off, -1 = adaptive (late frames are not held back)
VSync=0
; frame limiter: -1 = the monitor's refresh rate, 0 = off, or frames per second.
; The game's animations (menu fades and slides) stall at very high frame rates.
MaxFps=-1
; 1 = swap front/back face culling (only if models look inside-out or parts of the picture are missing)
CullFlip=0
; 1 = when the game asks for full screen, show it in a borderless window covering the monitor
;     (the picture is scaled to fit, keeping its aspect ratio); 0 = leave the game's window as it is
Borderless=1
; --- quality options (0 = the original look) ---
; anisotropic filtering of the 3D world's textures: 0 = off, 2, 4, 8 or 16 (sharper ground and
; walls seen at a slant; limited to what the graphics card offers). Only textures the game already
; samples with linear + mipmap filtering change; menus, HUD and pixel art are untouched.
Anisotropy=16
; multisample anti-aliasing (smooth polygon edges): 0 = off, 2, 4 or 8 samples. Costs GPU time and
; memory at high resolutions; screenshots and the game's own read-backs see the smoothed picture.
; Edges cut out by alpha test (foliage, fences) are not smoothed.
MSAA=0
; 1 = trilinear filtering: blend between mipmap levels where the game switches between them
;     abruptly (visible bands on the ground); 0 = as the game asks
TextureFilter=1
; ambient occlusion (soft shadows in corners, under and between objects):
; 0 = off (original look), 1 = on, 2 = show only the occlusion as a grey picture (for tuning).
; The developer menu (MenuKey) has an "Ambient occlusion" page to change these while playing.
AmbientOcclusion=1
; reach of the effect in world units (Joan is about 79 units tall)
AmbientOcclusionRadius=40
; darkness (0 = none ... 4 = very dark)
AmbientOcclusionStrength=1.8
; full effect up to this distance from the camera, fading out until twice this distance
AmbientOcclusionDistance=2500
; key that saves a picture of the screen as openjoan_shotNNN.bmp next to joan.exe
; (Windows virtual-key code in decimal: 122 = F11, 0 = off; F12 is the game's Mission Brief)
ScreenshotKey=122
; 1 = log every vertex shader SHADER\nvlinker.dll links (fragment names, declaration, all
;     shader tokens, the constant registers the game asks for), each distinct shader once.
;     (Module en3d/helpers22, on unless [Hooks] Disable lists it.)
ShaderLog=0

[Display]
; desktop  = the size of the primary monitor (recommended)
; original = 1024x768, as the game shipped
; WIDTHxHEIGHT, e.g. 2560x1440 (scaled to the monitor, keeping the aspect ratio)
; Ignored while the community widescreen d3d8.dll is installed next to joan.exe.
Resolution=desktop
; 1 = tell Windows the game handles DPI itself (real pixels at 125% / 150% scaling)
DpiAware=1
; Size of the in-mission HUD (health, portraits, combo, messages, dialogue):
; 1 = original pixel size, 1.5 / 2 / ... = bigger, auto = from the resolution (1080p 1, 1440p 1.5, 4K 2.5).
UiScale=auto

[Audio]
; The game's 3D sound, voices and music play through OpenAL Soft (soft_oal.dll next to openjoan.exe, built with it;
; lib/openal/openal_soft.cpp); Creative's OpenAL32.dll and eax.dll in the game folder are not loaded.
; OpenAL Soft's HRTF (binaural 3D sound for headphones): 0 = off, like the original's DirectSound3D panning (the
; default), 1 = on, auto = OpenAL Soft decides (on when Windows reports headphones)
HRTF=0
; 1 = sounds closer than their reference distance (the hero's own steps and blows) come from the middle, as with the
; game's original OpenAL 1.0; 0 = OpenAL Soft's exact direction for every sound
NearSoundsCentered=1
; 1 = the sounds are kept in memory: WAVE.RES (every sound effect, 80 MB) and the music / ambience tracks (MUSIC\*.wma,
; 40 MB) read while the game starts, a mission's voice archives while it loads, each in the background. The game frees
; the sounds not playing every few seconds and loads them again on their next play, and opens a track whenever one
; starts; this takes them from memory instead of the disk (no small hitch when a sound or track starts).
; 0 = read from disk each time, as the original
SoundsInMemory=1
; 1 = log every OpenAL call of the game (arguments, errors) to openjoan_audio.log; TraceLines = calls logged in full
Trace=0
TraceLines=20000

[Video]
; Movies (movie\*.wmv) and music / ambience (music\*.wma) are decoded by FFmpeg (avformat / avcodec / swscale /
; swresample DLLs next to openjoan.exe).

[Platform]
; 1 = the item, particle and item-script files (ITEM, TEXTURE\PARTICLE, SCRIPT\PSCRIPT: ~65 MB) are read into memory in
; the background while the game starts, and TEXTURE\ITEM is opened once then. Opening a file during play can take
; several ms (a virus scanner checks it): each first item drop or effect stuttered. 0 = every file opened from disk
FilesInMemory=1
; The game window and its messages are an SDL3 window (SDL3.dll next to openjoan.exe; platform/sdl_window.cpp); full
; screen is SDL's borderless desktop window. The OpenGL context, buffer swaps and vsync go through SDL, and the
; game's clocks (timeGetTime, QueryPerformanceCounter) and Sleep come from SDL's timers. Keyboard and mouse are read
; from SDL events (platform/sdl_input.cpp; no DirectInput, dinput8.dll not loaded); the mouse uses SDL's relative
; mode (raw motion, as DirectInput's exclusive mouse). The game's files are opened, read, written, listed and mapped
; by our own portable code (platform/files.cpp: C stdio, std::filesystem); critical sections, interlocked counts,
; the clock / calendar / time zone and COM by our own code too (platform/system.cpp; ole32.dll not loaded).
; Double-byte editions (a RESOURCE\CODEPAGE.RES naming code page 932, 936, 949 or 950: the Chinese release): the
; characters the game's fonts lack are drawn from a CJK font of the system (en2d/cjk_glyphs.cpp, ADR-0004). Empty or
; auto = the first that exists of Noto Sans CJK / Source Han Sans, WenQuanYi, Droid Sans Fallback (Linux) or Microsoft
; YaHei, SimSun, MingLiU, MS Gothic, Malgun Gothic (Windows); a path = that font file (.ttf / .ttc / .otf); off = none
; (the characters stay blank, as before). Editions without CODEPAGE.RES (English, French, German ...) never use it.
CjkFont=
; Game pads: 1 = up to four pads through SDL in the game's joystick slots, laid out as the
; joystick the game knows - left stick = X / Y, right stick = Z / Rz, D-pad = hat, buttons 1-12 = A, B, X, Y, LB, RB,
; Back, Start, left stick, right stick, LT, RT (assignable in the game's key settings); plugging in / out while the
; game runs works. 0 = no pads
Gamepad=1
; The Cursor Sensitivity slider of the input options, 0..20: 10 = the original game's speed, 0 = 25%, 20 = 400%
CursorSensitivity=10
; The first pad in the menus (main menu, in-game menu, options, save / load): left stick = cursor, D-pad = jump to the
; next button in that direction, A = click, B = back (Esc), right stick = scroll. 0 = the mouse only.
PadMenu=1
; The menu cursor's speed on the left stick, in % (100 = about the screen's width in a second at full tilt)
PadCursorSpeed=100
; Sticks: the deadzone in % of the throw (stops drift: a stick resting inside it reads centred) and the response
; curve (1.0 = linear, 1.5 - 2.0 = finer control near the centre, faster at the edge)
PadDeadzone=15
PadCurve=1.0
; How far a trigger (LT / RT) goes down before it counts as pressed, in %
PadTrigger=50
; Vibration strength in % (0 = off): hits taken (stronger the more health is lost), being knocked down, and a light tap
; for every hit landed (firmer every tenth hit of a combo)
PadRumble=100
; The right stick in the game (no menu up): the camera with the joystick input method (180 degrees a second around,
; 90 up / down at full tilt; on foot the camera then stays where the stick left it), the mouse cursor in
; RTS mode. Speed in % (0 = off), and 1 = up / down reversed
PadCamera=100
PadCameraInvert=0
; 1 = the input method of INPUT OPTIONS follows the device used last: a pad button / stick -> joystick, a key / the
; mouse -> keyboard & mouse. 0 = only as chosen there
PadAutoInput=1
; The character set of the game's text (platform/text.cpp; the C runtime's code-page and locale calls are ours):
; auto = Windows' ANSI code page on Windows (1252 elsewhere); or a number - 1250, 1251, 1252, 1253,
; 1254 or 1257 (e.g. 1250 for Polish or Czech text, 1251 for Russian)
CodePage=auto

[Fixes]
; Corrections of bugs in the original game. 0 = exactly as the original, 1 = fixed.
; Shaders: correct the vertex shader lighting / fog of our shader linker (render/nvlink, on unless
;     [Hooks] Disable lists it):
;     lights' diffuse no longer replaced by the specular factor, working specular highlights,
;     normals without the object's position added, spot light attenuation / range per light,
;     fog distance from the real vertex position, lit alpha = material alpha.
Shaders=1
; GlowDepth=1: light glows (lanterns, torches) no longer shine through walls and objects in front
; of them (the original draws them without a depth test). OpenGL renderer only.
GlowDepth=1
; SoundSlots=1: 32 sound slots instead of the original 12. With 12, busy scenes (rain's ambient loops, battles)
; used them all up: new sounds were not played and ambient sounds took over the farthest slot, cutting its sound short.
SoundSlots=1
; WetSounds=1: in rain the game plays only the "_WET" version of step / jump / dash sounds, and the ones recorded
; without it (the jump, the dash) were silent; they now play their ground version.
WetSounds=1
; MissingSounds=1: sounds the game's data forgot to name: the idle voice lines of the Bastard of Orleans and Richemont
; (ORIDLE2, RIIDLE2), recorded like the other heroes' but left out of their animation tables; and the attack swings of
; the Bastard, Richemont and Charles VII, whose tables have none (played as AllHeroes heroes).
MissingSounds=1
; IdleRate=1: idle units play their idle variety (IDLE2 / IDLE3, the heroes' idle voice lines) as often at any frame rate
; as at 60 fps; the original rolls for it once per frame, so at 144 fps it came more than twice as often.
IdleRate=1
; TriggerSort=1: the trigger list (zone sounds, unit and object triggers) is sorted by the records' own key byte. The
; original's comparator reads that byte next to the pointer slot instead of in the record, so the order came from the
; bits of neighbouring heap addresses: deterministic on one build, different on every other (and on 64-bit, where the
; slots are twice as wide). A replay uses the value the recording was made with.
TriggerSort=1
; UnitStuck=1: soldiers escorting their leader (the troop following Joan) no longer run in place. The original puts a
; soldier's formation spot next to the leader even when that spot is off the walkable ground (on a wall, in the water); the
; soldier walked to the edge and then "arrived" and asked again every frame, running against the wall. Now the spot moves
; onto walkable ground near the leader (never into the leader), and a soldier that cannot get any closer counts as
; arrived and stops. Also: any unit following a route that gets no closer to its next waypoint for a second (pushing
; against a wall or another unit the route did not know about) stops instead of running in place; a soldier does not
; try the same spot from the same place again for five seconds.
; A replay uses the value the recording was made with.
UnitStuck=1
; ImmovableSiege=1: ordering a siege weapon that no crew can move (the trebuchet, the arbalest: all their crew positions
; are for firing) to move answers "unable to comply" instead of the original's "need more men", which suggested that
; more soldiers would get it moving. A weapon that can move but lacks men keeps the original line.
; A replay uses the value the recording was made with.
ImmovableSiege=1
; AnimalPen=1: animals placed where the map's walkable area does not reach (the pigs in their pens: the level designers
; left the pens out of it) graze in place. In the original they play the walk animation on the spot: they keep picking
; places to wander to and the physics refuses every step off the walkable area. (Letting them move is no option: off the
; walkable area nothing collides, so they walk through the fences.)
; A replay uses the value the recording was made with.
AnimalPen=1
; MouseOptions=1: the input options get ten lower steps on the camera slider (a tenth of the original's minimum) and a
; cursor sensitivity slider; 0 = the original page (a replay applies the recording's value).
MouseOptions=1
; MissionCount=1: the campaign ends after the last mission in the game folder instead of after mission 8, so a mission
; can be added: scenario\scenario_09.scr (copy one of the eight and point it at your world, units and scripts), then
; scenario_10.scr and so on, without gaps. Missions after 8 grade with mission 8's limits, show "Yow win!" unless the
; text table has a VICTS entry for them, and use mission 1's loading pictures. With the shipped missions nothing changes.
; A replay uses the value the recording was made with.
MissionCount=1
; MusicStartWait=1: music and ambience start without stopping the game. The original primes the music's sound source
; with a few ms of silence and sleeps the game thread until it has played (~9 ms: a small hitch whenever a track
; starts, e.g. the battle music); now the silence just plays in front of the music. Movies keep the wait.
MusicStartWait=1
; CutsceneGrass=1: keep the grass in cutscenes (the original removes it whenever a scripted
; camera takes over).
CutsceneGrass=1
; MouseTurn=1: modern mouse look - smooth turning in floating point, independent of the frame
; rate (the original turned in whole degrees per frame, so slow movement at high fps did nothing).
MouseTurn=1
; UninitReads=1: replace the functions whose original code reads memory that was never written
; (stack garbage); the replacements use the value the code clearly meant (module fix/uninit).
; Keep 1 (the default): with 0 those functions are left to joan.exe's original code, which no longer
; exists, so the first one the game reaches ends it with "original code needed".
UninitReads=1

[Game]
; UnitIndex=1: the "which units are near" queries (recruiting, target search) look at each map sector's units from a
; kept list instead of walking every object of the sector (scenery, grass). 0 = walk as the original.
UnitIndex=1
; ItemPreload=1: the models of every item that can drop (food, potions, arrows, gold, gems, crosses) are built while
; the first mission loads and kept, so a box breaking or a unit dropping something does not build its model then
; (a small hitch each time). 0 = built on each drop and freed again, as the original.
ItemPreload=1
; AnimCache=1: the converted animations are kept in ANIM_TMP\ in the game folder. A unit type's animations are
; converted (every bone made relative to its parent) each time they load - most of a long hitch when a cutscene's
; camera reaches an army. The first start converts every animation once (a longer start); from then on they load
; from ANIM_TMP\ (only used for exactly the files they came from: the same result). 0 = converted on every load.
AnimCache=1
; AllHeroes=1: the "Command the Bastard of Orleans / Sir Arthur de Richemont / King Charles VII" keys (5, 6, 7) also
; take that hero over in action mode, like keys 1-4 (Switch character still cycles the original four). 0 = only in
; RTS mode, as the original. Not part of the original game.
AllHeroes=1

[Debug]
; Profile=N: every N seconds a sampling profile of the game's main thread in openjoan.log (which functions the
; frame time goes to; needs openjoan.pdb next to the exe). 0 = off; costs a few % while on.
Profile=0
; HitchLog=N: every frame that takes longer than N ms is logged with what happened during it (files opened, shader
; programs compiled, textures made, sounds loaded), to find what a short stutter comes from. Pick N well above your
; normal frame time (e.g. 15 at 140 fps). 0 = off
HitchLog=0
; AnimCensus=N: every N seconds, which animations are played how often, how long each is and whether it moves
; anything at all (STATIC = every pose it can show is the same). 0 = off
AnimCensus=0
; UnitIndexCheck=N: every Nth lookup is compared with the full walk; on a difference openjoan.log says so and the index
; switches itself off (the walk's answer is used). 1 = check every lookup (for replay verification), 0 = never.
UnitIndexCheck=64
; HeapGuard=1: find writes past the end of heap blocks (for crashes such as "heap corruption" 0xc0000374). Every block
; of the game's heap gets its own memory pages, and its end touches a page that cannot be accessed: the first byte
; written past the end crashes the game at the very instruction that wrote it, and openjoan.log names that function
; ("heap guard: writing ... bytes past the end of block ..." and the crash report under it). Freed blocks become
; inaccessible too (use after free). Slow and uses much more memory: only to diagnose a crash, then set it back to 0.
; Ignored while recording / replaying (Record= / Replay=).
HeapGuard=0
; ImportCensus=1: count every call the game makes to its Windows imports (joan.exe's import table) and write the
; counts to openjoan_imports.txt at exit (the list of what still uses Windows - phase C5)
ImportCensus=0
; SaveAudit=1: while the game writes a file through its File class (saves, quicksaves, profile / options:
; File::file_write 0x005872e0, file_write_array, file_put_long), every dword of the written data that lies in
; joan.exe's address range 0x00400000..0x00a96000 is logged to openjoan.log ("SaveAudit ..." lines: file, file
; position, offset in the buffer, value, what the value is - data object / vtable / string / thunk / code - and
; the calling code), with one summary line per file when it is closed. Only logs, the files are written as before.
; Purpose (stage S7b): find out whether save files contain absolute image addresses, which are no longer valid since
; the data image moves. Values that point into the moved image (joan_image) are reported too, with the original
; address they stand for ("= joan_image address of ..."). Small numbers that happen to lie in the range (colours,
; counters) are listed too; the classification tells them apart. Since ASLR (stage S7d) a pointer to our own memory
; (heap, openjoan.exe) can lie in that range too and is then listed as if it were an original address. Leave at 0 for
; normal play.
; SaveAudit=2: as 1, plus values that point into the game's heap, and for every record written field by field
; (SaveFieldwise, below) each image / heap value named with its record field: "SaveAudit2 ... Nation+0x136b gap_136b
; [gap]" - a pointer-like value in a gap, an opaque range or the tail of a string is a finding for re/save/records.json.
SaveAudit=0
; SaveFieldwise=1 (default): every save record (re/save/records.json, S0..S6) is written and read field by field
; (src/save/io.hpp), into the bytes joan.exe writes on every platform. 0 = the old raw writes / reads of the 32-bit
; game, for comparisons on the 32-bit build only: the 64-bit build ignores it (raw x64 objects are not a save format).
SaveFieldwise=1
; SaveCompare=1 (32-bit build): every field-wise record is also built the old raw way and compared byte for byte, on
; save and on load. Differences are logged ("SaveCompare MISMATCH <record> write +0x.. <field> ..."), and each file's
; totals when it is closed ("SaveCompare <file> closed: N records compared, M mismatches"). Logging only: the file is
; written field-wise as before. 0 mismatches in a played / replayed session is the test of the conversion.
SaveCompare=0
; Key that opens the developer menu (module debug/menu, on by default; [Hooks] Disable=debug/menu turns
; it off). Windows virtual-key code in decimal:
; 192 = the ` key (VK_OEM_3), 120 = F9, 119 = F8.
MenuKey=192
; Free camera for looking around a level: this key (virtual-key code; 120 = F9) turns it on / off. While
; it is on the game gets no input. W / A / S / D move, Q / E down / up, Shift faster, Ctrl slower; hold the
; right mouse button (or use the arrow keys) to turn. FreecamSpeed = world units per second (Joan is ~79 tall).
FreecamKey=120
FreecamSpeed=1000
; --- Record / replay (src/replay/replay.hpp): verify that a code change does not change the game ---
; Record=FILE: record this session to FILE (relative = the game folder, e.g. Record=test1.jrp). Every input
; the game gets from Windows (time, keyboard / mouse via DirectInput, window messages, file listings, registry,
; display modes, sound stream positions ...) is written to FILE, with a hash of the game's state at every frame.
; Replay=FILE: run the game from FILE instead of real input (no keyboard / mouse / clock is read; sleeps and waits are
; skipped) and compare every frame's state hash. Result in openjoan.log ("replay:" lines) and FILE.report.txt; exit
; code 0 = identical, 3 = divergence (the game made another call than recorded: frame and call are named),
; 4 = state hash mismatches, 5 = FILE unusable. Command line alternative: openjoan.exe --record FILE / --replay FILE.
; Replay needs the same game files, the same save folder contents (copy them with the recording) and an audio device
; if the recording had one. Both empty = off (nothing is wrapped, no cost).
Record=
Replay=
; ReplayDumpPage=0x00a52000: diagnostics - the raw words of that page of the hashed range, every frame, appended to
; <recording>.pages-record.bin / .pages-replay.bin (u32 frame + 1024 words), for diffing two runs word by word.
ReplayDumpPage=
; ReplayDumpImage=PATH: diagnostics - the normalised hashed words of every ReplayDumpImageEvery-th frame (default 1) from
; frame ReplayDumpImageFrom (default 0) on, as (u32 frame, the hashed range) records. Made on an x86 and an x64 replay of
; the same recording, the two files are compared word by word by tools/replay_image_diff.py (Phase 2 step 4).
ReplayDumpImage=
ReplayDumpImageEvery=1
ReplayDumpImageFrom=0
; Set while recording (stored in the recording; a replay uses the recording's settings):
; ReplayHashHeap=1: also hash the CRT heap (all blocks of the game's malloc heap, order-independent). Experimental:
; uninitialised bytes in heap blocks may differ between runs.
ReplayHashHeap=0
; ReplayHashBackBuffer=1: also hash the rendered picture (64x48 samples of the back buffer at each Present). Only
; comparable on the same machine / driver.
ReplayHashBackBuffer=0
; ReplaySnapshotEvery=N: store the whole (normalised) .data/.bss image every N frames (0 = never; ~0.5 MB each). A
; replay then lists the differing words with their data symbols for those frames. N=1 for short diagnostic runs.
ReplaySnapshotEvery=0
; ReplaySnapshotFirst=N: also a snapshot in each of the first N frames (default 8), so a mismatch that starts early
; lists its words.
ReplaySnapshotFirst=8
; ReplayHashTyped=1 (default): record with the typed image hash - pointer fields of the data image (from its C++ types,
; src/replay/hash_types.inc) normalised, other typed fields compared raw, untyped bytes by the old heuristics. 0: the
; old heuristic scheme (recordings made before the typed hash are always replayed with the scheme they were made with).
ReplayHashTyped=1
; ReplayHashSkip=ADDR[+LEN],...: more original data addresses (0x009f4000..0x00a6d000) left out of the state hash,
; for values that differ from run to run without mattering (LEN defaults to 4 bytes). Always left out: the profiler's
; rdtsc values 0x00a485a8+0x60.
ReplayHashSkip=
; ReplayHashSkipReplay=ADDR[+LEN],... or @FILE (replay only): more ranges left out by this replay on top of the
; recording's list - for an x64 replay of an x86 recording, the words whose value depends on the pointer width
; (element sizes, buffer byte counts, stdio descriptors), so that the comparison reaches the real differences.
ReplayHashSkipReplay=
; ReplayHashFiles=1: record size and a fingerprint (first / last 64 KB) of every file the game opens for reading
; through its imports; a replay warns about files that differ. 2 = hash whole files (slow on first open: stutters
; while a mission loads), 0 = off.
ReplayHashFiles=1
; ReplayEnvDirs=DIR,...: folders or files (relative to the game folder) whose files are fingerprinted and carried in the
; recording at its start, and compared before a replay (saves / profiles).
ReplayEnvDirs=SAVE,CONFIG.DAT
; Replay only:
; ReplayRestoreSaves=1: when the ReplayEnvDirs folders differ from the recording's (e.g. the recorded session wrote an
; autosave), each is renamed to <folder>.before-replay-<date>-<time> and the recording's files are put in place;
; when the replay ends the game, your folder is moved back and the replay's copy is left as <folder>.replayed-<...>
; (nothing is deleted). 0 = leave the folders alone (warn only).
ReplayRestoreSaves=1
; ReplayOnDivergence=stop (end the game with the report) | continue (switch to live input and play on).
ReplayOnDivergence=stop
; ReplayPace=1: play at the recorded speed (the recording's clock); 0 = as fast as the machine runs (the frame
; limiter [Graphics] MaxFps is then off for the replay; turn VSync off too).
ReplayPace=1
; ReplayExitAtEnd=1: end the game when the recording ends (0 = continue with live input).
ReplayExitAtEnd=1
